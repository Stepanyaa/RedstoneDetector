# Redstone Detector Settings / Настройки Redstone Detector
# Language for messages (e.g., 'en' for English, 'ru' for Russian, 'de' for German, 'fr' for French, 'tr' for Turkish, 'pl' for Polish, 'pt' for Portuguese)
# Available languages
# - en: English (original)
# - ru: Russian (Russia)
# - de: Deutsch (German)
# - fr: Français (French)
# - tr: Türkçe (Turkish)
# - pl: Polski (Polish)
# - pt: Português (Brazilian Portuguese)

# If you want to help translate RedstoneDetector into your language or improve existing translations,
# join our Discord: https://discord.gg/72mzBTckKC and check the #translations channel.

# All translations (except the original English) were generated using AI.
# If something sounds unnatural, is inaccurate, or could be improved,
# please join our Discord (link above) and write in the #translations channel.
# Any help is greatly appreciated!

language: en

# Critical TPS level for freezing / Критический уровень TPS для заморозки
critical-tps: 15.0

# The maximum allowed amount of redstone in a chunk / Максимально допустимое количество редстоуна в чанке
max-redstone: 100

# Maximum allowed number of entities in a chunk / Максимально допустимое количество сущностей в чанке
max-entities: 100

# The time after which the redstone will unfreeze at low TPS. The value (-1) will never unfreeze. / Время, по истечении которого редстоун будет разморожен при низком TPS. Значение (-1) никогда не разморозится.
freeze-duration: 300

# The number of chunks scanned per tick / Количество чанков, сканируемых за один тик
chunks-per-tick: 3

# Check redstone at low TPS / Проверять редстоун при низком TPS
scan-on-low-tps: true

# Chunk data storage time (hours) / Время хранения данных о чанках (часов)
chunk-data-retention: 24

scan-loaded-chunks: true
