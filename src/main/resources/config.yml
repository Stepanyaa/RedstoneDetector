# ==========================================================
#  RedstoneDetector - config.yml (core settings)
#
#  Since 1.1.0 the configuration is split into several files:
#    - config.yml       core detection settings (this file)
#    - performance.yml  scanning / performance tuning
#    - blocks.yml       list of redstone / lag blocks
#    - gui.yml          administrator interface appearance
#    - messages.yml     general & admin messages
#  Translatable in-game messages live in the lang/ folder.
# ==========================================================

# Language for messages.
# Available: en, ru, de, fr, tr, pl, pt
# Join our Discord to help translate: https://discord.gg/72mzBTckKC
language: en

# Critical TPS level for freezing.
critical-tps: 15.0

# The maximum allowed amount of redstone in a chunk.
max-redstone: 100

# Maximum allowed number of entities in a chunk.
max-entities: 100

# Time (seconds) after which redstone unfreezes at low TPS. -1 = never.
freeze-duration: 300

# Chunk data storage time (hours).
chunk-data-retention: 24

# ----------------------------------------------------------
# NOTE: performance keys (chunks-per-tick, scan-on-low-tps,
# scan-loaded-chunks, heavy-scan-*) moved to performance.yml.
# They are still read from here as a fallback for old setups.
# ----------------------------------------------------------
