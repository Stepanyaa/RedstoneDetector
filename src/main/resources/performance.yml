# ==========================================================
#  RedstoneDetector - performance.yml
#  Performance and scanning tuning.
# ==========================================================

# Number of chunks scanned per server tick (background scanner + queued scans).
chunks-per-tick: 3

# Run the automatic scan when the server TPS drops below the critical level.
scan-on-low-tps: true

# Only scan chunks that are currently loaded.
scan-loaded-chunks: true

# Heavy-scan tuning (used by hybrid/large scans).
heavy-scan-radius: 10000
heavy-scan-chunks-per-tick-base: 5

# Cache dashboard statistics for this many milliseconds.
# Reduces recalculation when the GUI refreshes frequently.
stats-cache-ms: 1000

# Minimum interval (ms) between two manual scans.
# Protects against accidental re-launch spam.
scan-cooldown-ms: 3000
